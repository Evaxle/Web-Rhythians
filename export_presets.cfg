[preset.0]
name="Web"
platform="HTML5"
runnable=true
custom_features=""
export_filter="resources"
export_files=PoolStringArray()
include_filter="assets/songs/*.sspmr,assets/songs/*.txt,localization/*.csv,localization/*.translation,bundled_maps/*.sspm"
exclude_filter="web/*.js,web/*.css,web/*.html,web/*.b64,web/*.ico,web/tests/*,build/*,.git/*,addons/discord_game_sdk/*,addons/godot-openvr/*,addons/native_dialogs/*,vr/*,assets/images/ui/dya.webm,assets/worlds/event_horizon/starmap_4k.png"
export_path="build/web/game.html"
script_export_mode=1

[preset.0.options]
custom_template/debug=""
custom_template/release=""
variant/export_type=0
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
