name: Replace repository with Rhythian-client

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/replace-with-rhythian-client.yml

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Web-Rhythians
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Rhythian-client
        run: git clone --depth 1 --branch main https://github.com/Evaxle/Rhythian-client.git /tmp/rhythian-client

      - name: Replace repository contents
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rhythian-client/. .
          rm -rf .git
          git init
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/rhythian-client/. .
          rm -rf .git
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Replace Web-Rhythians with Rhythian-client source"
          git push origin main
