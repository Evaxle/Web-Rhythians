name: Browser WebAssembly overhaul

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/browser-overhaul.yml

permissions:
  contents: write

jobs:
  overhaul:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply browser compatibility layer
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ui/menu/Sidebar.gd /tmp/Sidebar.gd
          curl -fsSL https://raw.githubusercontent.com/Evaxle/Web-Rhythians/7cf98dc606b6938da2e63520f8bf971dc536bfda/patches/web.patch -o /tmp/web.patch
          git apply --check /tmp/web.patch
          git apply /tmp/web.patch
          cp /tmp/Sidebar.gd scripts/ui/menu/Sidebar.gd

      - name: Finish production browser port
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          old = 'https://rhythians.vercel.app'
          new = 'https://www.rhythians.com'
          for rel in ['project.godot','scripts/Rhythian.gd','web/app.js']:
              p = root / rel
              text = p.read_text()
              text = text.replace(old, new)
              p.write_text(text)

          sidebar = Path('scripts/ui/menu/Sidebar.gd')
          text = sidebar.read_text()
          marker = '\tportal.z_index = 50\n'
          if marker not in text:
              raise SystemExit('Sidebar ready marker not found')
          text = text.replace(marker, marker + '\tif OS.has_feature("HTML5"): WebPortal.menu_ready()\n', 1)
          sidebar.write_text(text)

          shell = Path('web/shell.html')
          text = shell.read_text()
          text = text.replace('<link rel="stylesheet" href="app.css">', '<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#080b12"><link rel="stylesheet" href="app.css">')
          text = text.replace('<button id="account">Sign in</button></header>', '<button id="import-sspm" type="button">Import SSPM</button><input id="sspm-picker" type="file" accept=".sspm,application/octet-stream" multiple hidden><button id="account">Sign in</button></header>')
          text = text.replace('<div class="game-tools"><button id="back">Back to Rhythians</button><span id="game-status"></span></div>', '<div class="game-tools"><button id="back">Back to Rhythians</button><button id="fullscreen" type="button">Fullscreen</button><span id="game-status"></span></div>')
          persist = '''<script>
          window.rhythiansPersistUserData=()=>new Promise((resolve,reject)=>{
            const fs=globalThis.FS||(globalThis.Module&&globalThis.Module.FS);
            if(!fs||typeof fs.syncfs!=="function"){resolve(false);return;}
            fs.syncfs(false,error=>error?reject(error):resolve(true));
          });
          if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
          document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")window.rhythiansPersistUserData().catch(()=>{});});
          addEventListener("pagehide",()=>window.rhythiansPersistUserData().catch(()=>{}));
          setInterval(()=>window.rhythiansPersistUserData().catch(()=>{}),10000);
          </script>'''
          if persist not in text:
              text = text.replace('</head>', persist + '</head>')
          shell.write_text(text)

          app = Path('web/app.js')
          text = app.read_text()
          marker = "$('prev').onclick=()=>{offset=Math.max(0,offset-40);render();};$('next').onclick=()=>{offset+=40;render();};window.onhashchange=()=>{offset=0;render();};\n"
          if marker not in text:
              raise SystemExit('app.js navigation marker not found')
          extra = r'''async function importSspmFiles(files){
            try{
              let imported=0;
              for(const file of files){
                if(!/\.sspm$/i.test(file.name)||file.size>134217728)throw new Error('Choose SSPM files below 128 MiB each.');
                const id='local-'+crypto.randomUUID();
                await saveMap({id,title:file.name.replace(/\.sspm$/i,''),artist:'Local import',mapper:'Browser',isRanked:false,isLegacy:false},file);
                imported++;
              }
              if(imported){location.hash='library';await render();notice(`${imported} SSPM map${imported===1?'':'s'} imported and saved in this browser.`);}
            }catch(error){notice(error.message);}
          }
          $('import-sspm').onclick=()=>{$('sspm-picker').value='';$('sspm-picker').click();};
          $('sspm-picker').onchange=async()=>importSspmFiles($('sspm-picker').files);
          document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='o'){event.preventDefault();$('import-sspm').click();}});
          $('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await $('game').requestFullscreen();else await document.exitFullscreen();$('canvas').focus();}catch(error){$('game-status').textContent='Fullscreen unavailable: '+error.message;}};
          document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit fullscreen':'Fullscreen';});
          '''
          text = text.replace(marker, marker + extra, 1)
          drop_old = "window.addEventListener('drop',async event=>{event.preventDefault();event.stopImmediatePropagation();$('drop').hidden=true;try{for(const file of event.dataTransfer.files){if(!/\\.sspm$/i.test(file.name)||file.size>134217728)throw new Error('Choose an SSPM file below 128 MiB.');const id='local-'+crypto.randomUUID();await saveMap({id,title:file.name.replace(/\\.sspm$/i,''),isRanked:false},file);}location.hash='library';await render();}catch(error){notice(error.message);}},true);"
          drop_new = "window.addEventListener('drop',async event=>{event.preventDefault();event.stopImmediatePropagation();$('drop').hidden=true;await importSspmFiles(event.dataTransfer.files);},true);"
          if drop_old not in text:
              raise SystemExit('app.js drop handler marker not found')
          text = text.replace(drop_old, drop_new, 1)
          text = text.replace("window.rhythiansReady=text=>{const state=JSON.parse(text);if(!state.persistent)notice('Game settings storage is unavailable in this browser.');engineReady?.resolve();resolveMenu?.();resolveMenu=undefined;};", "window.rhythiansReady=text=>{const state=JSON.parse(text);if(!state.persistent)notice('Persistent game storage is unavailable; browser data may be temporary.');else window.rhythiansPersistUserData?.().catch(()=>{});engineReady?.resolve();resolveMenu?.();resolveMenu=undefined;};")
          app.write_text(text)

          css = Path('web/app.css')
          c = css.read_text()
          c += '\n#sspm-picker[hidden]{display:none!important}.game-tools{gap:10px}.game-tools #game-status{flex:1}#game:fullscreen{background:#05070d}#game:fullscreen canvas{width:100vw!important;height:calc(100vh - 56px)!important;max-width:none!important}\n'
          css.write_text(c)

          Path('web/manifest.webmanifest').write_text(json.dumps({
            'name':'Rhythians Web','short_name':'Rhythians','start_url':'./','scope':'./','display':'standalone',
            'background_color':'#080b12','theme_color':'#080b12',
            'icons':[{'src':'logo.png','sizes':'128x128','type':'image/png'}]
          }, separators=(',',':')))

          build = r'''#!/usr/bin/env bash
          set -euo pipefail
          GODOT_BIN="${GODOT_BIN:-godot}"
          mkdir -p build/web
          python3 - <<'PY2'
          from pathlib import Path
          import base64
          Path('web/logo.png').write_bytes(base64.b64decode(Path('web/logo.b64').read_text().strip()))
          PY2
          node web/tests/sspm_test.mjs
          "$GODOT_BIN" --path . --export-pack Web /tmp/rhythians-web-check.pck 2>&1 | tee /tmp/export-pack.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' /tmp/export-pack.log; then exit 1; fi
          "$GODOT_BIN" --path . --export Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed loading resource' /tmp/export.log; then exit 1; fi
          "$GODOT_BIN" --path . --editor --quit 2>&1 | tee /tmp/import.log || true
          "$GODOT_BIN" --path . web/tests/Smoke.tscn --headless 2>&1 | tee /tmp/smoke.log
          grep -q 'SMOKE_FAILURES=0' /tmp/smoke.log
          cp web/app.js web/app.css web/sspm.mjs web/logo.png web/manifest.webmanifest build/web/
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          grep -q 'https://www.rhythians.com' web/app.js
          grep -q 'id="import-sspm"' web/shell.html
          grep -q 'RhythiansBrowser' web/app.js
          grep -q 'rhythiansPersistUserData' web/shell.html
          ! grep -Rqs 'https://rhythians.vercel.app' project.godot scripts/Rhythian.gd web/app.js
          '''
          Path('scripts').mkdir(exist_ok=True)
          Path('scripts/build-web.sh').write_text(build.replace('          ',''))

          pages = '''name: Build and deploy Rhythians Web\n\non:\n  push:\n    branches: [main]\n  workflow_dispatch:\n\npermissions:\n  contents: read\n  pages: write\n  id-token: write\n\nconcurrency:\n  group: github-pages\n  cancel-in-progress: true\n\njobs:\n  build:\n    timeout-minutes: 25\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Install Godot 3.6.1\n        run: |\n          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/3.6.1-stable/Godot_v3.6.1-stable_linux_headless.64.zip -o /tmp/godot.zip\n          unzip -q /tmp/godot.zip -d /tmp/godot\n          sudo install /tmp/godot/Godot_v3.6.1-stable_linux_headless.64 /usr/local/bin/godot\n          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/3.6.1-stable/Godot_v3.6.1-stable_export_templates.tpz -o /tmp/templates.tpz\n          mkdir -p "$HOME/.local/share/godot/templates/3.6.1.stable"\n          unzip -j -q /tmp/templates.tpz 'templates/webassembly*' -d "$HOME/.local/share/godot/templates/3.6.1.stable"\n      - name: Build and test WebAssembly client\n        run: bash scripts/build-web.sh\n      - uses: actions/upload-pages-artifact@v3\n        with:\n          path: build/web\n  deploy:\n    needs: build\n    runs-on: ubuntu-latest\n    environment:\n      name: github-pages\n      url: ${{ steps.deployment.outputs.page_url }}\n    steps:\n      - uses: actions/configure-pages@v5\n        with:\n          enablement: true\n      - uses: actions/deploy-pages@v4\n        id: deployment\n'''
          Path('.github/workflows').mkdir(parents=True, exist_ok=True)
          Path('.github/workflows/pages.yml').write_text(pages)

          readme = '''# Rhythians Web\n\nBrowser/WebAssembly build of the Rhythian client. Gameplay stays in the original Godot client; browser-only compatibility code replaces unsupported desktop APIs.\n\n## Browser features\n\n- Rhythians device-code sign-in through `https://www.rhythians.com` without storing the user's website password.\n- Rhythians maps, profile, leaderboard, wiki and clips APIs.\n- Godot `user://` data persisted by the HTML5 filesystem/IndexedDB and explicitly flushed while playing and when the page is hidden or closed.\n- `RhythiansBrowser` IndexedDB stores the linked installation token, downloaded SSPM map blobs, map metadata, browser settings and pending score submissions.\n- SSPM import button, multi-file import, Ctrl/Cmd+O and drag-and-drop. Imported maps are local-only and do not submit ranked passes.\n- Downloaded maps remain playable from the browser library without signing in again.\n- Fullscreen gameplay and lazy WebAssembly startup.\n- GitHub Pages build/deploy from `main` with Godot 3.6.1.\n\nClearing browser site data removes locally stored maps/settings. Browser storage persistence is best-effort and depends on the browser. Desktop-only Discord Rich Presence, OpenVR and native OS file dialogs are disabled in the web build. Browser score submissions are still subject to server-side verification before rank rewards.\n\nLocal build: install Godot 3.6.1 + HTML5 export templates and run `bash scripts/build-web.sh`.\n'''
          Path('README.md').write_text(readme)
          PY
          chmod +x scripts/build-web.sh
          rm -f .github/workflows/browser-overhaul.yml
          git status --short

      - name: Commit browser overhaul
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port Rhythian client to browser WebAssembly"
          git push origin main
