name: Build and deploy web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Apply browser compatibility changes
        run: git -C source apply ../patches/web.patch
      - name: Install Godot
        env:
          GODOT_VERSION: 4.4.1
        run: |
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Import and export
        run: |
          mkdir -p source/bundled_maps
          find maps -maxdepth 1 -type f -iname "*.sspm" -exec cp {} source/bundled_maps/ \;
          godot --headless --editor --path source --import
          python3 source/tests/make_fixtures.py
          test_data=$(mktemp -d)
          timeout 30s env XDG_DATA_HOME="$test_data" godot --headless --path source tests/Integration.tscn 2>&1 | tee /tmp/integration.log
          grep -q 'INTEGRATION_FAILURES=0' /tmp/integration.log
          if grep -Eq 'SCRIPT ERROR|FAIL:' /tmp/integration.log; then exit 1; fi
          timeout 30s env XDG_DATA_HOME="$test_data" godot --headless --path source tests/Restore.tscn 2>&1 | tee /tmp/restore.log
          grep -q 'FRESH_PROCESS_RESTORE=true' /tmp/restore.log
          if grep -Eq 'SCRIPT ERROR' /tmp/restore.log; then exit 1; fi
          mkdir -p source/build/web
          godot --headless --path source --export-release Web build/web/index.html 2>&1 | tee /tmp/export.log
          if grep -Eq "SCRIPT ERROR|Failed to load script|Parse Error" /tmp/export.log; then exit 1; fi
          test -s source/build/web/index.html
          test -s source/build/web/index.wasm
          test -s source/build/web/index.pck
          touch source/build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
