name: Build and deploy Rhythians-Client Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install Godot 3.6.1
        run: |
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/3.6.1-stable/Godot_v3.6.1-stable_linux_headless.64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v3.6.1-stable_linux_headless.64 /usr/local/bin/godot
          curl -fsSL https://github.com/godotengine/godot-builds/releases/download/3.6.1-stable/Godot_v3.6.1-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/templates/3.6.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/webassembly*' -d "$HOME/.local/share/godot/templates/3.6.1.stable"
      - name: Build and test WebAssembly client
        run: bash scripts/build-web.sh
      - name: Validate Pages output
        run: |
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          test -s build/web/404.html
          test -f build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployed Pages site
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --max-time 30 "${{ steps.deployment.outputs.page_url }}" -o /tmp/rhythians-client.html; then
              grep -Fq "Rhythians-Client" /tmp/rhythians-client.html
              exit 0
            fi
            sleep 5
          done
          exit 1
