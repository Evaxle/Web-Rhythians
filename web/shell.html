<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rhythians</title>
<link rel="icon" href="favicon.ico">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070911">
<link rel="stylesheet" href="app.css">
$GODOT_HEAD_INCLUDE
<script>
window.rhythiansPersistUserData=()=>new Promise((resolve,reject)=>{
  const fs=globalThis.FS||(globalThis.Module&&globalThis.Module.FS);
  if(!fs||typeof fs.syncfs!=="function"){resolve(false);return;}
  fs.syncfs(false,error=>error?reject(error):resolve(true));
});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")window.rhythiansPersistUserData().catch(()=>{});});
addEventListener("pagehide",()=>window.rhythiansPersistUserData().catch(()=>{}));
setInterval(()=>window.rhythiansPersistUserData().catch(()=>{}),10000);
</script>
</head>
<body>
<main id="launcher">
  <section class="launch-card">
    <img class="logo" src="logo.png" alt="Rhythians">
    <p class="eyebrow">RHYTHIANS · WEB CLIENT</p>
    <h1>Rhythians</h1>
    <p class="description">Launch the full client in your browser. Maps, settings, credits, modifiers, SSPM imports and the rest of the client are handled inside Rhythians.</p>
    <button id="play" type="button">Play</button>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
</main>
<section id="client" hidden>
  <canvas id="canvas" tabindex="0" aria-label="Rhythians client"></canvas>
  <div id="client-status" role="status" aria-live="polite" hidden></div>
</section>
<input id="sspm-picker" type="file" accept=".sspm,application/octet-stream" multiple hidden>
<script src="$GODOT_URL"></script>
<script>window.gameEngine=new Engine($GODOT_CONFIG);</script>
<script type="module" src="app.js"></script>
</body>
</html>
