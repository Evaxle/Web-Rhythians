<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rhythians</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070910">
<link rel="stylesheet" href="app.css">
$GODOT_HEAD_INCLUDE
<script>
window.rhythiansPersistUserData=()=>new Promise((resolve,reject)=>{
  const fs=globalThis.FS||(globalThis.Module&&globalThis.Module.FS);
  if(!fs||typeof fs.syncfs!=="function"){resolve(false);return;}
  fs.syncfs(false,error=>error?reject(error):resolve(true));
});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")window.rhythiansPersistUserData().catch(()=>{});});
addEventListener("pagehide",()=>window.rhythiansPersistUserData().catch(()=>{}));
setInterval(()=>window.rhythiansPersistUserData().catch(()=>{}),10000);
</script>
</head>
<body>
<section id="launcher" class="launcher">
  <div class="launch-card">
    <img src="logo.png" alt="Rhythians" class="launch-logo">
    <p class="eyebrow">RHYTHIANS WEB CLIENT</p>
    <h1>Rhythians</h1>
    <p id="launch-copy">The full Rhythians client, directly in your browser.</p>
    <div id="launch-home">
      <button id="launch-play" class="primary hero-button" type="button">Play</button>
    </div>
    <div id="session-choice" hidden>
      <button id="signin-rhythians" class="primary choice-button" type="button">Sign in with Rhythians</button>
      <button id="play-guest" class="secondary choice-button" type="button">Play as guest <span>Not recommended</span></button>
      <button id="back-launch" class="link-button" type="button">Back</button>
    </div>
    <div id="signin-state" hidden>
      <div class="auth-spinner" aria-hidden="true"></div>
      <h2>Confirm on Rhythians</h2>
      <p id="signin-copy">Opening Rhythians in a new tab…</p>
      <strong id="signin-code"></strong>
      <a id="signin-link" target="_blank" rel="noopener noreferrer" hidden>Open Rhythians</a>
      <button id="cancel-signin" class="secondary" type="button">Cancel</button>
    </div>
    <p id="launch-status" role="status" aria-live="polite"></p>
  </div>
</section>

<section id="game" hidden>
  <div class="game-tools">
    <div class="game-brand"><img src="logo.png" alt="">Rhythians</div>
    <span id="account-state">Guest</span>
    <span id="game-status" role="status" aria-live="polite"></span>
    <button id="import-sspm" type="button">Import SSPM</button>
    <input id="sspm-picker" type="file" accept=".sspm,application/octet-stream" multiple hidden>
    <button id="fullscreen" type="button">Fullscreen</button>
    <button id="change-account" type="button">Account</button>
  </div>
  <canvas id="canvas" tabindex="0" aria-label="Rhythians game"></canvas>
</section>

<div id="drop" hidden>Drop SSPM files to import them into Rhythians</div>
<script src="$GODOT_URL"></script>
<script>window.gameEngine=new Engine($GODOT_CONFIG);</script>
<script type="module" src="app.js"></script>
</body>
</html>
